<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ABYSS: Marine Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- WebGL Render Canvas -->
  <canvas id="vrCanvas"></canvas>
  
  <!-- 2D HUD Canvas (Renders dual HUD for SBS or single HUD for Normal) -->
  <canvas id="hudCanvas"></canvas>

  <!-- MAIN MENU OVERLAY -->
  <div id="mainMenu" class="overlay">
    <div class="menu-card">
      <h1 class="glow-title">ABYSS</h1>
      <p class="subtitle">SAVE THE BLUE — MARINE EXPLORER</p>
      
      <div class="button-group">
        <button id="btnStartNormal" class="btn primary">START DIVE (NORMAL)</button>
        <button id="btnStartSBS" class="btn primary glowing">START DIVE (SBS VR)</button>
        <button id="btnMarineLog" class="btn secondary">MARINE LOG</button>
        <button id="btnSettings" class="btn secondary">SETTINGS</button>
      </div>

      <div class="controls-hint">
        <p><b>Movement:</b> Hold Touch Screen / WASD to Swim</p>
        <p><b>VR Mode:</b> Insert into Cardboard/VR headset & tilt head to look</p>
      </div>
    </div>
  </div>

  <!-- MARINE LOG MODAL -->
  <div id="marineLogModal" class="overlay hidden">
    <div class="menu-card wide">
      <h2>DEFENSE & MARINE LOG</h2>
      <div id="logList" class="log-grid">
        <!-- Dynamically populated -->
      </div>
      <button id="btnCloseLog" class="btn secondary">BACK TO MENU</button>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="overlay hidden">
    <div class="menu-card">
      <h2>SETTINGS</h2>
      <div class="setting-item">
        <label for="sensRange">Gyro Sensitivity</label>
        <input type="range" id="sensRange" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="setting-item">
        <label for="swimSpeedRange">Swim Speed</label>
        <input type="range" id="swimSpeedRange" min="2" max="10" step="1" value="5">
      </div>
      <button id="btnCloseSettings" class="btn secondary">SAVE & CLOSE</button>
    </div>
  </div>

  <!-- GAME END OVERLAY -->
  <div id="gameEndOverlay" class="overlay hidden">
    <div class="menu-card">
      <h1 id="endTitle" class="glow-title">MISSION COMPLETE</h1>
      <p id="endMessage" class="subtitle"></p>
      <button id="btnRestart" class="btn primary">MAIN MENU</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
